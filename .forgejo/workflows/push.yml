---
name: Push
on:
  push:
  workflow_dispatch:
  pull_request:

jobs:
  fmt:
    runs-on: home-linux-amd64
    container:
      image: ghcr.io/inko-lang/inko:main
    steps:
      - uses: actions/checkout@v7
      - run: inko --version
      - run: inko fmt --check

  test:
    runs-on: home-linux-amd64
    container:
      image: ghcr.io/inko-lang/inko:main
    steps:
      - uses: actions/checkout@v7
      - run: inko --version
      - run: inko test
